name: APK bauen

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Projekt holen
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Adresse der Karten eintragen
        run: |
          sed -i "s#__CARDS_URL__#https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/cards.json#" android/app/src/main/assets/index.html
          grep -c "raw.githubusercontent.com" android/app/src/main/assets/index.html

      - name: APK bauen
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Agora.apk

      - name: APK als Download bereitstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Agora APK
          body: Die aktuelle App. Datei Agora.apk herunterladen und auf dem Handy installieren.
          files: Agora.apk
